<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Rift : Build Calculator</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="css/style.css">

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=BBH+Bartle&family=BBH+Bogle&family=BBH+Hegarty&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap&ffamily=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>

  <div class="patch">Current Patch: <span>7.2</span></div>
  
  <header>
    <div class="wrapper" data-url="https://discord.gg/WASb7cdtUF">
      <span>What should I <B>BUILD</B>?</span>
      <img class="wr-logo" src="img/wr_logo.avif" alt="League of Legends Wild Rift">
      <h1>Build Calculator</h1>
      <span>Get your build <b>stats</b>, <b>passives</b> and <b>gold</b></span>
      <span>Powered to you by <b>COACHINOS</b></span>
      <span><b>Click</b> to join our <b>Discord Server</b></span>
    </div>
    
  </header>

  <main class="builder">
    <div class="builder__sticky">
      <section class="slots" id="slots"></section>

      <div class="builder__actions">

        <button type="button" id="calculate">
          <div class="button-title">
            Calculate
          </div>
          <div class="button-hover"></div>
        </button>
        <button type="button" id="clear">
          <div class="button-hover"></div>
          <div class="button-title">
            Clear
          </div>
        </button>
      </div>

      <p class="notice" id="notice" hidden></p>
    </div>

    <section class="results" id="results" hidden>
      <!-- <button type="button" class="results__close" id="resultsClose" title="Hide results">×</button> -->
      <div class="results__body" id="resultsBody"></div>
    </section>

    <section class="gallery" id="gallery"></section>

    <div class="item-tooltip" id="itemTooltip" hidden></div>
  </main>

  <section class="blog-footer">
    <label for="github">Github: </label>
    <a href="https://github.com/JxViii" target="_blank">JxViii
      <img src="img/icons/github.png" alt="Github Logo">
    </a>
  </section>

  <script src="js/statTypes.js"></script>
  <script src="js/items/physical.js"></script>
  <script src="js/items/magic.js"></script>
  <script src="js/items/defense.js"></script>
  <script src="js/items/support.js"></script>
  <script src="js/items/active.js"></script>
  <script src="js/items/boots.js"></script>
  <script src="js/items.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
